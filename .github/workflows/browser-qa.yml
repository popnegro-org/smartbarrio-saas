name: Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-functional-accessibility:
    name: Browser + Functional + Accessibility QA
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: qa-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: qa-service-role-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Supabase Edge Functions
        run: deno check supabase/functions/dispatch-offer/index.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Validate Docker Compose
        run: |
          cp .env.example infra/.env
          docker compose --env-file infra/.env -f infra/docker-compose.yml config --quiet
          rm infra/.env
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start mock Supabase REST
        run: |
          node tests/qa/mock-supabase.mjs > /tmp/mock-supabase.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:54321/rest/v1/tenants?select=slug" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mock-supabase.log
          exit 1

      - name: Build
        run: npm run build
      - name: Start application
        run: npm run start -- --hostname 0.0.0.0 > /tmp/smartbarrio-next.log 2>&1 &
      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/index.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smartbarrio-next.log
          exit 1
      - name: Run Browser Functional Accessibility QA
        run: npx playwright test tests/qa/browser-functional-accessibility.spec.js
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartbarrio-browser-qa
          path: |
            playwright-report
            test-results
            /tmp/smartbarrio-next.log
          if-no-files-found: ignore

  visual-regression:
    name: Visual Regression Evidence (non-blocking)
    runs-on: ubuntu-latest
    needs: browser-functional-accessibility
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start application
        run: npm run start -- --hostname 0.0.0.0 > /tmp/smartbarrio-next.log 2>&1 &
      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/index.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smartbarrio-next.log
          exit 1
      - name: Capture visual evidence (production and candidate)
        run: npx playwright test tests/qa/visual-regression.spec.js
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VISUAL_BASELINE_URL: https://smartbarrio.vercel.app
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartbarrio-visual-regression
          path: |
            test-results
            playwright-report
            /tmp/smartbarrio-next.log
          if-no-files-found: ignore
